      <text x="52" y="49" fill="#b49aff" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2">MEASURED OUTCOMES</text><text x="1148" y="49" fill="#abb2c8" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="14" font-weight="500" text-anchor="end" >02 / IMPACT</text><text x="52" y="109" fill="#f4f5ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" >Impact, made tangible.</text><text x="52" y="145" fill="#abb2c8" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" >Selected results across data, platform scope, and service quality.</text><g filter="url(#shadow)"><rect x="52" y="180" width="516" height="365" rx="24" fill="url(#glass)" stroke="#333346" /></g><line x1="76" y1="181" x2="544" y2="181" stroke="#b49aff" stroke-width="1" opacity=".55"/><text x="80" y="224" fill="#f4f5ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" >One database workflow</text><rect x="400" y="201" width="132" height="32" rx="16" fill="#191a2b" stroke="#8ae9cb" stroke-opacity=".35"/><text x="466.0" y="223" fill="#8ae9cb" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle" >30×</text><text x="80" y="294" fill="#f4f5ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="49" font-weight="700" text-anchor="start" >5 min</text><text x="262" y="289" fill="#b49aff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="400" text-anchor="start" >→</text><text x="328" y="294" fill="#8ae9cb" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="49" font-weight="700" text-anchor="start" >10 sec</text><text x="80" y="345" fill="#abb2c8" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" >BEFORE</text><text x="530" y="345" fill="#ab