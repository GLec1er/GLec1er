<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
    <title id="title">Measured backend and data engineering outcomes</title><desc id="desc">One database workflow fell from 300 seconds to 10 seconds, a 30-times speedup. Other reported scope and outcomes: 12+ services, 500+ ML models, approximately 40% fewer production defects, 15% faster response time, 85%+ critical coverage, 50+ test types, and up to 15 specialists led.</desc><defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#10111c"/><stop offset=".52" stop-color="#111221"/><stop offset="1" stop-color="#1b1830"/></linearGradient>
      <radialGradient id="violetGlow"><stop stop-color="#7057ce" stop-opacity=".45"/><stop offset="1" stop-color="#7057ce" stop-opacity="0"/></radialGradient>
      <radialGradient id="mintGlow"><stop stop-color="#4eb999" stop-opacity=".15"/><stop offset="1" stop-color="#4eb999" stop-opacity="0"/></radialGradient>
      <linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#28273d"/><stop offset=".5" stop-color="#1b1c2d"/><stop offset="1" stop-color="#181a27"/></linearGradient>
      <linearGradient id="edge"><stop stop-color="#f2eaff" stop-opacity=".9"/><stop offset=".5" stop-color="#b399ff" stop-opacity=".65"/><stop offset="1" stop-color="#5c497f" stop-opacity=".2"/></linearGradient>
      <linearGradient id="flow"><stop stop-color="#8ae9cb"/><stop offset="1" stop-color="#b49aff"/></linearGradient>
      <linearGradient id="slab" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#9d83e8"/><stop offset=".5" stop-color="#514279"/><stop offset="1" stop-color="#22233f"/></linearGradient>
      <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/><feOffset in="blur" dx="0" dy="12" result="offset"/><feFlood flood-color="#04050c" flood-opacity=".48" result="color"/><feComposite in="color" in2="offset" operator="in" result="cast"/><feMerge><feMergeNode in="cast"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <clipPath id="canvas"><rect width="1200" height="660" rx="32"/></clipPath>
      <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".75" fill="#c8bddf" opacity=".15"/></pattern>
    </defs>
    <g clip-path="url(#canvas)">
