<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
    <title id="title">Backend and data engineering scope</title><desc id="desc">Four areas of practice: APIs and services, data and messaging, processing and orchestration, platform and quality. The connectors are conceptual and do not depict any particular production deployment. Delivery mindset: design, build, test, observe, review, release, improve.</desc><defs>
