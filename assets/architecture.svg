<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Backend engineering scope</title>
  <desc id="desc">A visual map of backend engineering areas: APIs, data and messaging, processing, and platform and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <text x="56" y="62" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">Engineering scope</text>
  <text x="56" y="91" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">From request handling to distributed processing and production operations</text>
  <path d="M232 214H973" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="56" y="142" width="236" height="164" rx="20" fill="#172554" stroke="#2563eb"/>
    <rect x="322" y="142" width="236" height="164" rx="20" fill="#12372a" stroke="#16a34a"/>
    <rect x="588" y="142" width="236" height="164" rx="20" fill="#3b1d5a" stroke="#9333ea"/>
    <rect x="854" y="142" width="290" height="164" rx="20" fill="#422006" stroke="#f59e0b"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="84" cy="174" r="12" fill="#60a5fa"/>
    <text x="106" y="181" fill="#eff6ff" font-size="18" font-weight="800">APIs & services</text>
    <text x="80" y="222" fill="#bfdbfe" font-size="14">Python · Go · FastAPI</text>
    <text x="80" y="247" fill="#bfdbfe" font-size="14">Django/DRF · REST · gRPC</text>
    <text x="80" y="272" fill="#bfdbfe" font-size="14">asyncio · aiohttp · Pydantic</text>

    <circle cx="350" cy="174" r="12" fill="#4ade80"/>
    <text x="372" y="181" fill="#ecfdf5" font-size="18" font-weight="800">Data & messaging</text>
    <text x="346" y="222" fill="#bbf7d0" font-size="14">PostgreSQL · Redis</text>
    <text x="346" y="247" fill="#bbf7d0" font-size="14">Kafka · RabbitMQ</text>
    <text x="346" y="272" fill="#bbf7d0" font-size="14">SQL · ORM optimization</text>

    <circle cx="616" cy="174" r="12" fill="#c084fc"/>
    <text x="638" y="181" fill="#faf5ff" font-size="18" font-weight="800">Processing</text>
    <text x="614" y="222" fill="#e9d5ff" font-size="14">Celery · Airflow</text>
    <text x="614" y="247" fill="#e9d5ff" font-size="14">PySpark · Hadoop</text>
    <text x="614" y="272" fill="#e9d5ff" font-size="14">event-driven workflows</text>

    <circle cx="882" cy="174" r="12" fill="#fbbf24"/>
    <text x="904" y="181" fill="#fffbeb" font-size="18" font-weight="800">Platform & quality</text>
    <text x="880" y="222" fill="#fde68a" font-size="14">Docker · Kubernetes</text>
    <text x="880" y="247" fill="#fde68a" font-size="14">GitLab CI/CD · Jenkins</text>
    <text x="880" y="272" fill="#fde68a" font-size="14">Prometheus · testing</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="56" y="354" width="1088" height="64" rx="16" fill="#0b1220" stroke="#334155"/>
    <text x="80" y="381" fill="#67e8f9" font-size="14" font-weight="800">DELIVERY MINDSET</text>
    <text x="80" y="403" fill="#cbd5e1" font-size="14">Design → build → test → observe → review → release → improve</text>
  </g>
</svg>
