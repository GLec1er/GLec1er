    <text x="80" y="391" fill="#60a5fa" font-size="21" font-weight="800">12+</text>
    <text x="80" y="411" fill="#dbeafe" font-size="12">backend services</text>
    <text x="351" y="391" fill="#67e8f9" font-size="21" font-weight="800">500+</text>
    <text x="351" y="411" fill="#cffafe" font-size="12">ML models in scope</text>
    <text x="622" y="391" fill="#c084fc" font-size="21" font-weight="800">−40%</text>
