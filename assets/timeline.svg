oke="#b49aff" stroke-width="1" opacity=".55"/><text x="640" y="312" fill="#b49aff" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="17" font-weight="600" text-anchor="start" >2024–2025</text><text x="640" y="355" fill="#f4f5ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" >Backend</text><text x="640" y="387" fill="#f4f5ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" >Developer</text><text x="640" y="433" fill="#abb2c8" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" >Kafka · gRPC</text><text x="640" y="459" fill="#abb2c8" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" >Prometheus</text><circle cx="933" cy="223" r="25" fill="#131423" stroke="#f2cf8c" stroke-opacity=".25" stroke-width="8"/><circle cx="933" cy="223" r="17" fill="#26263a" stroke="#f2cf8c"/><text x="933" y="229" fill="#f2cf8c" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="14" font-weight="600" text-anchor="middle" >04</text><g filter="url(#shadow)"><rect x="898" y="274" width="250" height="217" rx="24" fill="url(#glass)" stroke="#333346" /></g><line x1="922" y1="275" x2="1124" y2="275" stroke="#f2cf8c" stroke-width="1" opacity=".55"/><text x="922" y="312" fill="#f2cf8c" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="17" font-weight="600" text-anchor="start" >2025–present</text><text x="922" y="355" fill="#f4f5ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" >Senior</text><text x="922" y="387" fill="#f4f5ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" >Technical Lead</text><text x="922" y="433" fill="#abb2c8" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" >Up to 15 specialists</